<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b4f48">
<title>Pozzo Manager – Stock</title>
<meta name="description" content="Pozzo Toys Stock inventory, purchases, return condition inspection, and stock issues.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#f4f7fa;--card:#ffffff;--sub:#f5fafe;--in:#ffffff;--line:#dce4ec;--ink:#1c1b1f;--mut:#5f6368;--grn:#1f6fa8;--bd:#deeffb;--bad:#a8431f;--amb:#8a5a14;--blu:#1f6fa8;--deep:#0f3f66}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;padding-bottom:calc(108px + env(safe-area-inset-bottom, 0px));-webkit-font-smoothing:antialiased;-webkit-overflow-scrolling:touch}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
.ptr{overflow:hidden;height:0;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bd);color:var(--deep);font-size:13px;font-weight:700;border-bottom:0 solid var(--line);transition:height .18s ease,opacity .18s ease;opacity:0;user-select:none}
.ptr.pulling{transition:none}
.ptr.active{opacity:1;border-bottom-width:1px}
.ptr.ready{background:#cde5f7}
.ptr-ic{display:inline-block;transition:transform .15s ease;font-size:15px;line-height:1}
.ptr.ready .ptr-ic{transform:rotate(180deg)}
@keyframes ptrSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.ptr.busy .ptr-ic{animation:ptrSpin .75s linear infinite}
header{padding:12px 16px 14px;background:#fff;border-bottom:3px solid var(--blu);text-align:center}
header img{display:block;margin:0 auto 4px;width:110px;max-width:40%;height:auto}
header h1{font-size:22px;color:var(--deep)}
.embed header{display:none}
main{width:100%;max-width:640px;margin:auto;padding:14px 12px;overflow-x:hidden}
.warnbox{background:#f6ece0;border:1px solid #e8d5b8;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:15px;color:#6b4a1b}
.warnbox.bad{background:#f6e4dc;border-color:#e8bfae;color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;min-width:0}
.stat small{color:var(--mut);font-size:13px;display:block}
.stat b{font-family:Georgia,serif;font-size:22px}
.stat.warn b{color:var(--amb)}.stat.bad b{color:var(--bad)}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px;max-width:100%}
.seg button{flex:1;min-width:0;border:0;border-radius:999px;padding:10px 4px;background:transparent;color:var(--mut);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--grn);color:#fff}
.seg i{font-style:normal;background:#e8bfae;color:var(--bad);border-radius:999px;padding:1px 7px;font-size:12px;margin-left:4px}
.seg button.on i{background:#fff;color:var(--grn)}
input,select,textarea{width:100%;min-width:0;max-width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:16px;background:var(--in);font:inherit;font-size:17px;color:var(--ink)}
textarea{line-height:1.4;resize:vertical}
label{display:block;font-size:15px;margin:12px 0 6px}
.chips{display:flex;gap:8px;margin:10px 0 14px;overflow-x:auto;max-width:100%}
.chips button{flex:none;border:1px solid var(--line);background:var(--in);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.chips button.on{background:var(--bd);border-color:var(--grn);color:var(--grn);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(60,50,30,.07);max-width:100%;overflow:hidden}
.card.big{border-radius:26px;padding:20px}
.card h3{font-size:23px;margin-bottom:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.prow>div{min-width:0;flex:1}
.prow .n{font-weight:600;font-size:16.5px;overflow-wrap:anywhere}
.prow .s{color:var(--mut);font-size:13.5px;overflow-wrap:anywhere}
.qty{font-family:Georgia,serif;font-size:25px;text-align:right;line-height:1;flex:none}
.qty.low{color:var(--amb)}.qty.out{color:var(--bad)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 8px;margin-left:6px;font-family:"Segoe UI",sans-serif}
.tag.low{background:#f6e6c9;color:var(--amb)}.tag.out{background:#f6e4dc;color:var(--bad)}.tag.good{background:var(--bd);color:var(--grn)}
.det{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px;font-size:15px}
.det p{margin:4px 0;color:var(--mut)}.det b{color:var(--ink)}
.det table,table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.det td,table.t td,table.t th{padding:6px 3px;border-top:1px solid var(--line);text-align:left}
table.t th{color:var(--mut);font-weight:500;border-top:0}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border-radius:14px;border:1px solid var(--line);background:var(--in);font:inherit;font-size:15px;font-weight:600;padding:11px 14px;color:var(--ink);cursor:pointer}
.btn.p{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.w{background:#f6e4dc;border-color:#e8bfae;color:var(--bad)}
.btn.f{display:block;width:100%;padding:15px;font-size:17px;border-radius:18px}
.btn:disabled{opacity:.55;cursor:default}
.issue .t{font-size:13px;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.03em}
.issue.manual .t{color:var(--amb)}
.issue.ret{border-left:6px solid var(--blu)}
.issue.ret .t{color:var(--blu)}
.issue p{margin:6px 0;font-size:15px;line-height:1.45}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom, 0px));background:var(--card);border-top:1px solid var(--line)}
.bar .btn{flex:1;font-size:16px;padding:14px 8px;border-radius:16px;white-space:nowrap}
.bar .btn.p{flex:1.4}.bar .btn:first-child{flex:1.4}.bar .btn:last-child{flex:.8}
.modal{position:fixed;inset:0;background:rgba(30,25,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:20px 18px 24px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet h3{font-size:24px;margin-bottom:4px}
.sheet .sub{color:var(--mut);margin:0 0 8px;font-size:15px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--grn);color:#fff;border-radius:999px;padding:10px 18px;font-size:15px;z-index:30;max-width:90%;text-align:center}
.empty{text-align:center;color:var(--mut);padding:26px 0}
.top small{color:var(--mut);font-size:15px}
.top h2{font-size:30px;margin:2px 0 14px}
.pr{background:var(--sub);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.pr .h{display:flex;justify-content:space-between;color:var(--mut);margin-bottom:8px}
.pr .h button{border:0;background:none;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{margin:8px 0 6px;color:var(--mut)}
.calc{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:16px;gap:8px}
.calc b{font-family:Georgia,serif}
.note{font-size:14px;margin:8px 0 0;color:var(--mut)}.note.w{color:#6b4a1b}.note.b{color:var(--bad);font-weight:600}
.sum{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:17px}
.sum.m{color:var(--mut)}
.sum.g{border-top:1px solid var(--line);margin-top:6px;padding-top:14px;font-size:20px;font-weight:700}
.sum.g span:last-child{font-size:30px;font-family:Georgia,serif}
.err{color:var(--bad);font-size:15px;margin:0 0 12px}
#busy{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--grn);color:#fff;padding:6px 16px;border-radius:999px;font-size:13px;z-index:60}
.cd{font-family:Georgia,serif;font-weight:700;font-size:18px;letter-spacing:.06em;color:var(--grn)}
.cd.big{font-size:30px;margin-bottom:2px}
.pick{border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;background:var(--in)}
.pick.on{border-color:var(--grn);background:var(--bd)}
.pick .btn{width:100%;margin-top:10px}
.ver{text-align:center;color:var(--mut);font-size:13px;margin:10px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<script>if(window.self!==window.top)document.documentElement.classList.add("embed")</script>
<div id="ptr" class="ptr" aria-live="polite"><span class="ptr-ic" aria-hidden="true">&#8595;</span><span class="ptr-tx">Pull down to refresh</span></div>
<header><img src="icon-192.png" alt="Pozzo Toys"><h1>Pozzo Stock</h1></header>
<main id="app"></main>
<div class="bar" id="bar"><button class="btn p" onclick="ui.newPurchase()">+ New purchase</button><button class="btn" onclick="ui.more()">More</button></div>
<div id="modal" class="modal" hidden></div>
<div id="busy" hidden>Working…</div>
<div id="toast" class="toast" hidden></div>
<script>
const VER="v4";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const num=v=>{const n=parseFloat(String(v).replace(/[,৳\s]|tk/gi,""));return isNaN(n)?0:n};
const tk=n=>"৳ "+(Math.round(n*100)/100).toLocaleString("en-US");
function today(){const t=new Date(),p=n=>String(n).padStart(2,"0");return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate())}
const cfg=()=>{try{return JSON.parse(localStorage.getItem("pt_cfg")||"{}")}catch(e){return{}}};
let CHAIN=Promise.resolve(),INFLIGHT=0;
const busy=()=>{const b=$("#busy");if(b)b.hidden=INFLIGHT===0};
function api(payload){
  INFLIGHT++;busy();
  const run=CHAIN.then(()=>apiRaw(payload));
  CHAIN=run.catch(()=>{});
  return run.finally(()=>{INFLIGHT--;busy()});
}
async function apiRaw(payload){
  const c=cfg();if(!c.url||!c.key)return {ok:false,error:"nocfg"};
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),45000);
  try{
    const r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:c.key},payload)),signal:ac.signal});
    return await r.json();
  }catch(e){return {ok:false,error:e&&e.name==="AbortError"?"slow":"no connection"}}
  finally{clearTimeout(t)}
}
const errText=e=>e==="nocfg"?"The Google Sheet is not connected. Open Connection settings on the Sales tab.":e==="no connection"?"Could not reach the Google Sheet. Check your internet.":e==="slow"?"Google is slow to answer. Tap Try again.":e;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3400)}
function postOrderDirty(orderId){
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:"pozzo:order-dirty",orderId:orderId||""},"*")}catch(e){}
}

function postStockDirty(){
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:"pozzo:stock-dirty"},"*")}catch(e){}
}

let S={products:[],counts:{units:0,value:0,low:0,tocheck:0,issues:0},suppliers:[],url:""};
let PLAN=null,IPLAN=null;
const initH=String(typeof location!=="undefined"?location.hash:"").replace(/^#/,"");
let loadErr="",view="main",tab=(initH==="issues"?"issues":(initH==="check"?"check":"stock")),fl=(initH==="low"||initH==="out"||initH==="arch")?initH:"all",q="",openId=null,CHK=[],ISS=[],RRET=[],HIST={},PUR=null,RECENT=[],IMP=null;
const prod=id=>S.products.find(p=>p.id===id);
const stat=p=>p.stock<=0?"out":p.stock<=p.low?"low":"ok";
const ui={};

const STOCK_CACHE_KEY="pt_stock_cache";
function getCachedStock(){
  try{
    const raw=sessionStorage.getItem(STOCK_CACHE_KEY);
    if(!raw)return null;
    const p=JSON.parse(raw);
    return(p&&p.data&&typeof p.ts==="number")?p:null;
  }catch(e){return null}
}
function setCachedStock(data){
  try{sessionStorage.setItem(STOCK_CACHE_KEY,JSON.stringify({ts:Date.now(),data:data}))}catch(e){}
}
function clearStockCache(){
  try{sessionStorage.removeItem(STOCK_CACHE_KEY)}catch(e){}
}

window.addEventListener("message",e=>{
  const d=e&&e.data;
  if(!d||typeof d!=="object")return;
  if(d.type==="pozzo:refresh-stock"||d.type==="pozzo:stock-dirty"){
    if(d.tab)tab=d.tab;
    if(d.filter)fl=d.filter;
    view="main";openId=null;HIST={};
    clearStockCache();
    load(true);
  }
});

let LOADING=false;
async function load(fresh){
  const cached=getCachedStock();
  if(!fresh&&cached&&cached.data&&!S.products.length){
    const j=cached.data;
    loadErr="";S=j;CHK=j.tocheck||[];ISS=j.issues||[];RRET=j.resolvedReturns||[];
    render();
    if(Date.now()-cached.ts<90000)return;
  }
  if(LOADING)return;
  LOADING=true;
  try{
    const j=await api({action:"stockload",fresh:!!fresh});
    if(!j.ok){
      if(!S.products.length){loadErr=errText(j.error);render()}
      return;
    }
    loadErr="";S=j;CHK=j.tocheck||[];ISS=j.issues||[];RRET=j.resolvedReturns||[];
    setCachedStock(j);
    render();
  }finally{LOADING=false}
}
function render(){
  $("#bar").hidden=view!=="main";
  if(view==="purchase")return renderPurchase();
  if(view==="import")return renderImport();
  if(view==="pconfirm")return renderPConfirm();
  if(view==="iconfirm")return renderIConfirm();
  renderMain();
}
function renderMain(){
  const c=S.counts;
  $("#app").innerHTML=`${loadErr?`<div class="warnbox bad">${esc(loadErr)}<br><button class="btn" style="margin-top:10px" onclick="ui.retry()">Try again</button></div>`:""}
  <div class="cards">
    <div class="stat"><small>Units in stock</small><b>${c.units}</b></div>
    <div class="stat"><small>Stock value (at cost)</small><b>${tk(c.value)}</b></div>
    <div class="stat ${c.low?"warn":""}"><small>Low or out of stock</small><b>${c.low}</b></div>
    <div class="stat ${c.issues?"bad":""}"><small>Open issues</small><b>${c.issues}</b></div></div>
  <div class="seg">
    <button class="${tab==="stock"?"on":""}" onclick="ui.tab('stock')">Stock</button>
    <button class="${tab==="check"?"on":""}" onclick="ui.tab('check')">To check${c.tocheck?`<i>${c.tocheck}</i>`:""}</button>
    <button class="${tab==="issues"?"on":""}" onclick="ui.tab('issues')">Issues${c.issues?`<i>${c.issues}</i>`:""}</button></div>
  <div id="body"></div>
  <p class="ver">Pozzo Stock ${VER}</p>`;
  ({stock:stockView,check:checkView,issues:issuesView})[tab]();
}
ui.tab=t=>{tab=t;openId=null;render()};
ui.retry=()=>load(true);

/* ---------- stock tab ---------- */
function stockView(){
  $("#body").innerHTML=`<input id="q" placeholder="Search products" value="${esc(q)}" oninput="q=this.value;renderRows()">
  <div class="chips">${[["all","All"],["low","Low stock"],["out","Out of stock"],["arch","Archived"]].map(([k,n])=>`<button class="${fl===k?"on":""}" onclick="fl='${k}';render()">${n}</button>`).join("")}</div>
  <div id="rows"></div>`;
  renderRows();
}
function renderRows(){
  const ql=q.trim().toLowerCase();
  const rows=S.products.filter(p=>(fl==="arch")===p.archived).filter(p=>fl==="low"?stat(p)==="low":fl==="out"?stat(p)==="out":true).filter(p=>!ql||(p.id+" "+p.name+" "+p.aliases.join(" ")).toLowerCase().includes(ql));
  $("#rows").innerHTML=!S.products.length&&!loadErr?`<div class="empty">No products yet. Tap More, then Import stock list, or Add a product.</div>`:rows.length?rows.map(p=>{
    const s=stat(p);
    return `<div class="card"><div class="prow" onclick="ui.toggle('${p.id}')">
      <div><div class="cd">${esc(p.id)}</div><div class="n">${esc(p.name)}${s==="low"?'<span class="tag low">low</span>':s==="out"?'<span class="tag out">out</span>':""}</div><div class="s">Sells at ${tk(p.price)} · avg cost ${tk(p.cost)}</div></div>
      <div class="qty ${s}">${p.stock}</div></div>
      ${openId===p.id?`<div class="det">
        <p>Accepted prices: <b>${p.prices.map(tk).join(", ")}</b></p>
        <p>Other names (same product): <b>${p.aliases.length?esc(p.aliases.join(", ")):"none"}</b></p>
        <p>Low-stock level: <b>${p.low}</b></p>
        <table>${(HIST[p.id]||[]).slice(0,6).map(h=>`<tr><td>${esc(h.time.slice(0,10))} · ${esc(h.type)}${h.ref?" "+esc(h.ref):""}</td><td style="text-align:right"><b>${h.qty>0?"+":"−"}${Math.abs(h.qty)}</b></td></tr>`).join("")}</table>
        <div class="acts"><button class="btn p" onclick="ui.edit('${p.id}')">Edit</button><button class="btn" onclick="ui.adjust('${p.id}')">Adjust stock</button><button class="btn" onclick="ui.merge('${p.id}')">Merge…</button></div></div>`:""}</div>`}).join(""):`<div class="empty">No products here.</div>`;
}
ui.toggle=async id=>{
  openId=openId===id?null:id;renderRows();
  if(openId&&!HIST[id]){const j=await api({action:"detail",pid:id});if(j.ok){HIST[id]=j.history;renderRows()}}
};

/* ---------- to check ---------- */
function checkView(){
  $("#body").innerHTML=CHK.length?`<p style="color:var(--mut);margin:0 0 12px;font-size:15px">Sales the app matched by itself. Tap <b>Looks right</b> or fix the match.</p>
  ${CHK.map(c=>`<div class="card"><div class="prow"><div><div class="n">${esc(c.typed)} ${tk(c.price)}</div><div class="s">${esc(c.order)} &rarr; <b>${esc(c.pid)} · ${esc(c.product)}</b></div></div><div class="s" style="text-align:right">stock<br><b>${c.before} &rarr; ${c.after}</b></div></div>
    <div class="acts"><button class="btn p" onclick="ui.checkOk('${c.id}')">Looks right</button><button class="btn w" onclick="ui.wrong('${c.id}')">Wrong match</button></div></div>`).join("")}
  <button class="btn f" onclick="ui.checkAll()">Mark all as checked</button>`:`<div class="empty">Nothing to check.</div>`;
}
ui.checkOk=async id=>{const j=await api({action:"checkok",ids:[id]});j.ok?toast("Marked as checked."):toast(errText(j.error));load(true)};
ui.checkAll=async()=>{const j=await api({action:"checkok",all:true});j.ok?toast("All marked as checked."):toast(errText(j.error));load(true)};
ui.wrong=id=>{
  const c=CHK.find(x=>x.id===id);
  modal(`<h3>Wrong match</h3><p class="sub">${esc(c.typed)} was matched to ${esc(c.product)}. Pick the right product. The app undoes the wrong deduction and posts the right one. The sale itself is not changed.</p>
  <label>Correct product</label><select id="m1">${S.products.filter(p=>!p.archived&&p.id!==c.pid).map(p=>`<option value="${p.id}">${esc(p.id)} · ${esc(p.name)} (${tk(p.price)})</option>`).join("")}</select>
  <div class="acts"><button class="btn p" onclick="ui.doWrong('${id}')">Correct it</button><button class="btn" onclick="ui.close()">Cancel</button></div>`);
};
ui.doWrong=async id=>{const j=await api({action:"checkwrong",id:id,pid:$("#m1").value});ui.close();j.ok?toast("Corrected."):toast(errText(j.error));HIST={};load(true)};

/* ---------- issues & return inspection ---------- */
function productOptionsHtml(selectedPid,includeEmpty){
  const live=S.products.filter(p=>!p.archived);
  const head=includeEmpty?`<option value="">-- Select product --</option>`:"";
  return head+live.map(p=>`<option value="${esc(p.id)}" data-cost="${p.cost}" data-stock="${p.stock}" ${p.id===selectedPid?"selected":""}>${esc(p.id)} · ${esc(p.name)} (stock: ${p.stock}, cost: ${tk(p.cost)})</option>`).join("");
}

function issuesView(){
  const T={
    price:"Price differs",
    name:"No matching product",
    neg:"Stock would go below zero",
    return:"Returned item · Inspect condition",
    manual:"Opened by you"
  };
  const openHtml=ISS.length?ISS.map(i=>{
    let msg="",btns="";
    if(i.kind==="return"){
      const mInfo=i.pid&&i.product
        ?`Matched product: <b>${esc(i.pid)} · ${esc(i.product)}</b> · Stock now: <b>${i.stock}</b> · Avg cost: <b>${tk(i.productCost)}</b>`
        :`<span style="color:var(--bad);font-weight:600">No automatic product match. Pick a product when inspecting.</span>`;
      msg=`<b>${esc(i.typed)} &times;${i.qty}</b> returned from order <b>${esc(i.order)}</b> (sold at ${tk(i.price)} each)<br><span style="color:var(--mut);font-size:14px">${mInfo}</span>`;
      btns=`<button class="btn p" onclick="ui.retGood('${i.id}')">&#10003; Good &middot; Back to stock (+${i.qty})</button>
        <button class="btn w" onclick="ui.retBad('${i.id}')">&#10005; Bad &middot; Loss by cost</button>
        ${i.qty>1?`<button class="btn" onclick="ui.retSplit('${i.id}')">Split Good / Bad</button>`:""}`;
    }else if(i.kind==="price"){
      msg=`<b>${esc(i.typed)} ${tk(i.price)}</b> (${esc(i.order)}) looks like <b>${esc(i.product)}</b>, but that product sells at ${tk(i.productPrice)}, not ${tk(i.price)}.`;
      btns=`<button class="btn p" onclick="ui.res('${i.id}','accept')">Accept ${tk(i.price)} too</button><button class="btn" onclick="ui.res('${i.id}','typo')">Price typo</button><button class="btn" onclick="ui.pick('${i.id}')">Different product</button>`;
    }else if(i.kind==="name"){
      msg=`<b>${esc(i.typed)} ${tk(i.price)}</b> (${esc(i.order)}) matches no product at that price.`;
      btns=`<button class="btn p" onclick="ui.res('${i.id}','create')">Create product</button><button class="btn" onclick="ui.pick('${i.id}')">Map to a product…</button><button class="btn" onclick="ui.res('${i.id}','none')">No stock item</button>`;
    }else if(i.kind==="neg"){
      msg=`<b>${esc(i.typed)} ${tk(i.price)}</b> (${esc(i.order)}) would take <b>${esc(i.product)}</b> below zero. The sale is saved. Stock was not changed.`;
      btns=`<button class="btn p" onclick="ui.adjust('${i.pid}')">Adjust stock</button><button class="btn" onclick="ui.res('${i.id}','post')">Deduct anyway</button><button class="btn" onclick="ui.res('${i.id}','none')">No stock item</button>`;
    }else{
      msg=esc(i.typed);
      btns=(i.pid?`<button class="btn p" onclick="ui.adjust('${i.pid}')">Adjust stock</button>`:"")+`<button class="btn" onclick="ui.res('${i.id}','close')">Close issue</button>`;
    }
    const cls="card issue "+(i.kind==="manual"?"manual":(i.kind==="return"?"ret":""));
    return `<div class="${cls}"><div class="t">${T[i.kind]||i.kind}</div><p>${msg}</p><div class="acts">${btns}</div></div>`;
  }).join(""):`<div class="empty">No open issues.</div>`;

  const recentHtml=RRET.length?`<div class="card big" style="margin-top:16px"><h3>Recent return inspections</h3>
    ${RRET.slice(0,10).map(r=>`<div style="padding:10px 0;border-top:1px solid var(--line);font-size:14px">
      <div style="display:flex;justify-content:space-between;gap:8px">
        <b>${esc(r.order)} &middot; ${esc(r.typed)} (&times;${r.qty})</b>
        <span style="color:var(--mut)">${esc(r.resolved||r.time)}</span>
      </div>
      <div style="color:var(--mut);margin-top:3px">${esc(r.resolution)}</div>
    </div>`).join("")}
  </div>`:"";

  $("#body").innerHTML=openHtml+recentHtml;
}

ui.retGood=id=>{

  modal(`<h3>Returned in good condition</h3>
  <p class="sub">Order <b>${esc(i.order)}</b> &middot; <b>${esc(i.typed)} &times;${i.qty}</b>.<br>Good items are added back to sellable stock.</p>
  <label>Product to restock</label>
  <select id="rg1" onchange="ui.rgUpdate('${id}')">${productOptionsHtml(i.pid,!i.pid)}</select>
  <div id="rginfo" style="margin-top:10px;font-size:15px"></div>
  <p id="rerr" class="err" style="margin-top:8px"></p>
  <div class="acts">
    <button class="btn p" onclick="ui.doRetGood('${id}')">&#10003; Good &middot; Add +${i.qty} to stock</button>
    <button class="btn" onclick="ui.close()">Cancel</button>
  </div>`);
  ui.rgUpdate(id);

ui.rgUpdate=id=>{
  const i=ISS.find(x=>x.id===id),sel=$("#rg1"),info=$("#rginfo");

  const p=prod(sel.value);
  if(!p){info.innerHTML=`<span style="color:var(--bad)">Select a product first so stock can be added.</span>`;return}
  info.innerHTML=`Stock will update: <b>${p.stock} &rarr; ${p.stock+i.qty}</b> (+${i.qty} pcs)`;
};
ui.doRetGood=async id=>{
  const i=ISS.find(x=>x.id===id),pid=$("#rg1").value,rerr=$("#rerr");
  if(!pid){if(rerr)rerr.textContent="Pick a product first.";return}

  if(!j.ok){if(rerr)rerr.textContent=errText(j.error);return}
  ui.close();HIST={};postOrderDirty(i?i.order:"");
  toast("Added back to stock: "+(j.text||"Done"));
  load(true);
};

ui.retBad=id=>{
  const i=ISS.find(x=>x.id===id);if(!i)return;
  const defCost=i.productCost||0;
  modal(`<h3>Returned in bad condition</h3>
  <p class="sub">Order <b>${esc(i.order)}</b> &middot; <b>${esc(i.typed)} &times;${i.qty}</b>.<br>Damaged items are <b>not</b> added back to stock. Their value is recorded as a loss by cost.</p>
  <label>Product</label>
  <select id="rb1" onchange="ui.rbSync('${id}')">${productOptionsHtml(i.pid,true)}</select>
  <label>Unit cost per piece (৳)</label>

  <div class="sum g" style="margin-top:10px"><span>Loss by cost (${i.qty} &times; unit cost)</span><span id="rbloss">${tk(i.qty*defCost)}</span></div>
  <p id="rerr" class="err" style="margin-top:8px"></p>
  <div class="acts">
    <button class="btn w" onclick="ui.doRetBad('${id}')">&#10005; Bad &middot; Record loss</button>
    <button class="btn" onclick="ui.close()">Cancel</button>

ui.rbSync=id=>{
  const p=prod($("#rb1").value);
  if(p)$("#rb2").value=p.cost||0;
  ui.rbCalc(id);
};
ui.rbCalc=id=>{
  const i=ISS.find(x=>x.id===id),c=Math.max(0,num($("#rb2").value));

ui.doRetBad=async id=>{
  const i=ISS.find(x=>x.id===id),pid=$("#rb1").value,rawCost=$("#rb2").value.trim(),rerr=$("#rerr");
  const p=prod(pid);
  if(!pid&&rawCost===""){if(rerr)rerr.textContent="Pick a product or enter the unit cost.";return}
  const cost=rawCost===""?(p?p.cost:0):Math.max(0,num(rawCost));
  const j=await api({action:"resolve",id:id,how:"return_bad",pid:pid,cost:cost});
  if(!j.ok){if(rerr)rerr.textContent=errText(j.error);return}
  ui.close();postOrderDirty(i?i.order:"");
  toast("Loss recorded: "+(j.text||"Done"));
  load(true);
};

ui.retSplit=id=>{
  const i=ISS.find(x=>x.id===id);if(!i)return;
  const g0=Math.max(0,i.qty-1),b0=i.qty-g0,c0=i.productCost||0;
  modal(`<h3>Split return inspection</h3>
  <p class="sub">Order <b>${esc(i.order)}</b> &middot; <b>${esc(i.typed)}</b> &middot; Total returned: <b>${i.qty} pcs</b>.</p>
  <label>Product</label>
  <select id="rs1" onchange="ui.rsSync('${id}')">${productOptionsHtml(i.pid,!i.pid)}</select>
  <div class="grid2">
    <div><label>Good qty (to stock)</label><input id="rsg" inputmode="numeric" value="${g0}" oninput="ui.rsCalc('${id}')"></div>
    <div><label>Bad qty (damaged loss)</label><input id="rsb" inputmode="numeric" value="${b0}" oninput="ui.rsCalc('${id}')"></div>
  </div>
  <label>Unit cost per piece (for damaged qty)</label>
  <input id="rsc" inputmode="numeric" value="${c0}" oninput="ui.rsCalc('${id}')">
  <div id="rsinfo" style="margin-top:10px;font-size:15px"></div>
  <p id="rerr" class="err" style="margin-top:8px"></p>
  <div class="acts">
    <button class="btn p" onclick="ui.doRetSplit('${id}')">&#10003; Confirm inspection</button>
    <button class="btn" onclick="ui.close()">Cancel</button>
  </div>`);
  ui.rsCalc(id);
};
ui.rsSync=id=>{
  const p=prod($("#rs1").value);
  if(p)$("#rsc").value=p.cost||0;
  ui.rsCalc(id);
};
ui.rsCalc=id=>{
  const i=ISS.find(x=>x.id===id),info=$("#rsinfo");if(!i||!info)return;
  const g=Math.max(0,Math.floor(num($("#rsg").value)));
  const b=Math.max(0,Math.floor(num($("#rsb").value)));
  const c=Math.max(0,num($("#rsc").value));
  const sum=g+b;
  if(sum!==i.qty){
    info.innerHTML=`<span style="color:var(--bad);font-weight:600">Good (${g}) + Bad (${b}) = ${sum}, must equal ${i.qty}.</span>`;
  }else{
    info.innerHTML=`Back to stock: <b>+${g} pcs</b> &middot; Loss by cost: <b>${tk(b*c)}</b>`;
  }
};
ui.doRetSplit=async id=>{
  const i=ISS.find(x=>x.id===id),rerr=$("#rerr");
  const pid=$("#rs1").value,p=prod(pid);
  const g=Math.max(0,Math.floor(num($("#rsg").value)));
  const b=Math.max(0,Math.floor(num($("#rsb").value)));
  const rawCost=$("#rsc").value.trim();
  const c=rawCost===""?(p?p.cost:0):Math.max(0,num(rawCost));
  if(g+b!==i.qty){if(rerr)rerr.textContent="Good qty + Bad qty must equal "+i.qty+".";return}
  if(g>0&&!pid){if(rerr)rerr.textContent="Pick a product for the good items.";return}
  const j=await api({action:"resolve",id:id,how:"return_split",pid:pid,goodQty:g,badQty:b,cost:c});
  if(!j.ok){if(rerr)rerr.textContent=errText(j.error);return}
  ui.close();HIST={};postOrderDirty(i?i.order:"");
  toast("Return inspected: "+(j.text||"Done"));
  load(true);
};

ui.res=async(id,how,pid,letters)=>{
  const j=await api({action:"resolve",id:id,how:how,pid:pid,letters:letters});

}

function renderPurchase(){

    ${PUR.supplier==="__new"?`<label>New supplier name</label><input value="${esc(PUR.newSupplier)}" oninput="PUR.newSupplier=this.value" placeholder="Supplier name">`:""}</div>

    <div class="sum g"><span>Total cost</span><span id="t3"></span></div></div>

  ${RECENT.length?`<div class="card big"><h3>Recent purchases</h3>${RECENT.map(r=>`<div class="card" style="margin:10px 0 0"><div class="prow"><div><div class="n">${esc(r.id)} · ${esc(r.supplier)}</div><div class="s">${esc(r.date)} · ${tk(r.total)}${r.status==="voided"?" · voided":""}</div><div class="s">${esc(r.lines.join(", "))}</div></div>${r.status!=="voided"?`<button class="btn w" onclick="ui.voidP('${r.id}')">Void</button>`:""}</div></div>`).join("")}</div>`:""}

const findP=n=>{n=n.trim().toLowerCase();return S.products.find(p=>!p.archived&&(p.name.toLowerCase()===n||p.aliases.some(a=>a.toLowerCase()===n)))};
function drawLines(){
  $("#lines").innerHTML=PUR.lines.map((l,i)=>`<div class="pr"><div class="h"><span>Product ${i+1}</span>${PUR.lines.length>1?`<button onclick="ui.rmLine(${i})">Remove</button>`:""}</div>
    <input list="plist" value="${esc(l.name)}" placeholder="Search or type a new product" oninput="ui.setName(${i},this.value)">
    <div class="grid2">
      <div><label>Qty</label><input inputmode="numeric" value="${l.qty||""}" oninput="ui.setNum(${i},'qty',this.value)"></div>
      <div><label>Buying price</label><input inputmode="numeric" value="${l.buy||""}" oninput="ui.setNum(${i},'buy',this.value)"></div>
      <div><label>Selling price</label><input inputmode="numeric" value="${l.sell||""}" id="sell${i}" oninput="ui.setNum(${i},'sell',this.value)"></div>
      <div><label>Additional cost</label><input inputmode="numeric" value="${l.extra||""}" placeholder="batteries etc." oninput="ui.setNum(${i},'extra',this.value)"></div></div>
    <p class="note" id="n${i}"></p>
    <div class="calc"><span>Unit cost <b id="u${i}"></b></span><span>Line total <b id="l${i}"></b></span></div></div>`).join("");
  PUR.lines.forEach((l,i)=>pnote(i));pcalc();
}
function pnote(i){
  const l=PUR.lines[i],p=findP(l.name),e=$("#n"+i);if(!e)return;
  if(!l.name.trim()){e.textContent="";e.className="note";return}
  if(!p){e.textContent="New product. It will be created with this selling price.";e.className="note";return}
  if(l.sell&&l.sell!==p.price){e.textContent="Selling price changes from "+tk(p.price)+" to "+tk(l.sell)+". "+tk(p.price)+" stays accepted for matching sales.";e.className="note w"}
  else{e.textContent="In stock now: "+p.stock+" · average cost "+tk(p.cost);e.className="note"}
}
function pcalc(){
  let a=0,b=0;
  PUR.lines.forEach((l,i)=>{
    const unit=l.buy+l.extra;a+=l.qty*l.buy;b+=l.qty*l.extra;
    const u=$("#u"+i),t=$("#l"+i);if(u)u.textContent=tk(unit);if(t)t.textContent=tk(l.qty*unit);
  });
  $("#t1").textContent=tk(a);$("#t2").textContent=tk(b);$("#t3").textContent=tk(a+b);
}
ui.setName=(i,v)=>{const l=PUR.lines[i];l.name=v;const p=findP(v);if(p&&!l.sell){l.sell=p.price;const e=$("#sell"+i);if(e)e.value=p.price}pnote(i);pcalc()};
ui.setNum=(i,k,v)=>{PUR.lines[i][k]=num(v);if(k==="sell")pnote(i);pcalc()};
ui.addLine=()=>{PUR.lines.push(blankLine());drawLines()};
ui.rmLine=i=>{PUR.lines.splice(i,1);drawLines()};
ui.backMain=()=>{view="main";tab="stock";PUR=null;IMP=null;PLAN=null;IPLAN=null;load()};
ui.savePurchase=async()=>{
  const e=$("#err");e.textContent="";
  const bad=m=>{e.textContent=m;window.scrollTo(0,0)};
  const sup=PUR.supplier==="__new"?PUR.newSupplier.trim():PUR.supplier;
  if(!sup)return bad("Enter the supplier.");
  const used=PUR.lines.filter(l=>l.name.trim());
  if(!used.length)return bad("Add at least one product.");
  for(const l of used){
    if(l.qty<=0)return bad(l.name+": quantity must be above 0.");
    if(l.buy<=0)return bad(l.name+": enter the buying price.");
    if(l.sell<=0)return bad(l.name+": enter the selling price.");
    if(l.sell<l.buy+l.extra&&!confirm(l.name+": the selling price is below the unit cost. Continue?"))return;
  }
  const pj=await api({action:"purchaseplan",lines:used.map(l=>({name:l.name}))});
  if(!pj.ok)return bad(errText(pj.error));
  PLAN={sup:sup,used:used,plan:pj.lines,
    choice:pj.lines.map(l=>l.status==="exact"?{pid:l.product.id}:l.status==="new"?{new:true,letters:l.letters}:null),
    req:"pu"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
  view="pconfirm";render();window.scrollTo(0,0);
};
function pcBlock(p,u){
  return `<div class="cd big">${esc(p.id)}</div><div class="n" style="font-weight:600;font-size:17px">${esc(p.name)}</div>
  <div class="s" style="color:var(--mut);font-size:14px">In stock ${p.stock} &rarr; <b>${p.stock+u.qty}</b> · sells at ${tk(p.price)}${u.sell!==p.price?` <span class="tag low">new price ${tk(u.sell)}</span>`:""}</div>`;
}
function pcRow(l,i){
  const u=PLAN.used[i],c=PLAN.choice[i];
  let h=`<div class="card big"><div style="color:var(--mut);font-size:14px">You typed: <b style="color:var(--ink)">${esc(l.name)}</b> · ${u.qty} pcs · buy ${tk(u.buy)}</div>`;
  if(l.status==="exact")return h+`<div style="margin-top:10px">${pcBlock(l.product,u)}</div></div>`;
  if(l.status==="suggest"){
    h+=`<p class="note w" style="margin:10px 0 0">“${esc(l.name)}” is not saved yet. Is it the same as:</p>`+
    l.candidates.map(p=>{const on=c&&c.pid===p.id;return `<div class="pick ${on?"on":""}">${pcBlock(p,u)}<button class="btn ${on?"p":""}" onclick="ui.pPick(${i},'${p.id}')">${on?"✓ Same product":"Yes, same product"}</button></div>`}).join("");
  }
  const isNew=c&&c.new;
  h+=`<div class="pick ${isNew?"on":""}"><div class="cd big" style="color:var(--bad)">NEW product</div>
    <div style="color:var(--mut);font-size:14px">Code letters (4 English letters)</div>
    <input maxlength="4" style="text-transform:uppercase;margin-top:6px" value="${esc(isNew?c.letters:l.letters)}" oninput="ui.pLetters(${i},this.value)">
    <div style="color:var(--mut);font-size:14px;margin-top:6px">${l.code&&(!isNew||c.letters===l.letters)?"Code will be <b>"+esc(l.code)+"</b>":"The serial number is set when saved"}</div>
    <button class="btn ${isNew?"p":""}" onclick="ui.pNew(${i})">${isNew?"✓ New product":"No, new product"}</button></div></div>`;
  return h;
}
function renderPConfirm(){
  $("#app").innerHTML=`<div class="top"><small>Check before saving</small><h2>Confirm products</h2></div>
  <p class="note" style="margin:0 0 12px">Nothing is saved until you tap Confirm. Check each code and name against your notebook.</p>
  <p id="err" class="err"></p>
  ${PLAN.plan.map(pcRow).join("")}
  <div class="acts" style="margin-bottom:14px"><button class="btn p f" style="flex:1" onclick="ui.confirmPurchase()">&#10003; Confirm all and save</button></div>
  <button class="btn f" style="margin-bottom:14px" onclick="ui.pBack()">&larr; Back to edit</button>`;
}
ui.pPick=(i,pid)=>{PLAN.choice[i]={pid:pid};renderPConfirm()};
ui.pNew=i=>{const l=PLAN.plan[i],c=PLAN.choice[i];PLAN.choice[i]={new:true,letters:c&&c.new?c.letters:l.letters};renderPConfirm()};
ui.pLetters=(i,v)=>{const was=PLAN.choice[i]&&PLAN.choice[i].new;PLAN.choice[i]={new:true,letters:v.toUpperCase().replace(/[^A-Z]/g,"")};if(!was)renderPConfirm()};
ui.pBack=()=>{view="purchase";render()};
ui.confirmPurchase=async()=>{
  const e=$("#err");e.textContent="";
  const bad=m=>{e.textContent=m;window.scrollTo(0,0)};
  const lines=[];
  for(let i=0;i<PLAN.plan.length;i++){
    const c=PLAN.choice[i],u=PLAN.used[i];
    if(!c)return bad("Choose for “"+PLAN.plan[i].name+"”: same product, or new product.");
    if(c.new&&String(c.letters||"").length!==4)return bad("“"+u.name+"”: type 4 English letters for the new product code.");
    lines.push(Object.assign({},u,c.pid?{pid:c.pid}:{letters:c.letters}));
  }
  const btn=document.querySelector(".acts .btn.p");if(btn){btn.disabled=true;btn.textContent="Saving…"}
  const j=await api({action:"purchase",reqId:PLAN.req,date:PUR.date,supplier:PUR.sup,lines:lines});
  if(!j.ok){if(btn){btn.disabled=false;btn.textContent="✓ Confirm all and save"}return bad(errText(j.error))}
  postStockDirty();
  if(j.repeat)toast("This purchase was already saved. Nothing was added twice.");
  const sj=await api({action:"stockload",fresh:true});if(sj.ok){S=sj;CHK=sj.tocheck||[];ISS=sj.issues||[];RRET=sj.resolvedReturns||[]}
  const rj=await api({action:"purchases"});if(rj.ok)RECENT=rj.items;
  const sup=PLAN.sup;PLAN=null;HIST={};
  PUR={date:today(),supplier:sup,newSupplier:"",lines:[blankLine()]};
  view="purchase";renderPurchase();
  $("#result").innerHTML=`<div class="card big"><h3>Saved ${esc(j.id)}</h3>
    <table class="t"><tr><th>Product</th><th>Stock</th><th>Avg cost</th><th>Sells at</th></tr>
    ${j.lines.map(r=>`<tr><td><b>${esc(r.id)}</b><br>${esc(r.name)}${r.isNew?" <small>(new)</small>":""}</td><td>${r.before} &rarr; <b>${r.after}</b></td><td style="white-space:nowrap">${tk(r.avg)}</td><td style="white-space:nowrap">${tk(r.price)}</td></tr>`).join("")}</table></div>`;
  $("#result").scrollIntoView({behavior:"smooth"});
};
ui.voidP=async id=>{
  if(!confirm("Void "+id+"? The stock it added is taken off again. The record stays for the history."))return;
  const j=await api({action:"voidpurchase",id:id});
  if(!j.ok)return toast(errText(j.error));
  toast("Voided."+(j.notes&&j.notes.length?" "+j.notes.join(" · "):""));
  const sj=await api({action:"stockload",fresh:true});if(sj.ok){S=sj;CHK=sj.tocheck||[];ISS=sj.issues||[];RRET=sj.resolvedReturns||[]}
  const rj=await api({action:"purchases"});if(rj.ok)RECENT=rj.items;

/* ---------- import ---------- */
ui.importView=()=>{IMP={rows:[],note:"",text:""};view="import";render()};
function renderImport(){
  $("#app").innerHTML=`<div class="top"><small>Stock list</small><h2>Import products</h2></div>
  <div class="card big"><p class="note" style="margin:0 0 10px">Use an Excel or CSV file, or paste rows copied from a sheet. The first row can hold headings such as Name, Price, Stock, Cost, Low stock, Category. Without headings, the order is Name, Price, Stock, Cost.</p>
    <label>File</label><input type="file" id="ifile" accept=".xlsx,.csv,.txt" onchange="ui.readFile(this.files[0])">
    <label>Or paste here</label><textarea id="itext" rows="6" placeholder="Duck Phone, 390, 6, 260" oninput="ui.parseText(this.value)">${esc(IMP.text)}</textarea></div>
  <div id="ipreview"></div>
  <button class="btn f" style="margin-bottom:14px" onclick="ui.backMain()">Back to stock</button>`;
  drawImport();
}
function csvRows(text){
  const first=text.split(/\r?\n/)[0]||"";
  const d=first.indexOf("\t")>-1?"\t":(first.split(";").length>first.split(",").length?";":",");
  const rows=[];let row=[],cur="",inq=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inq){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else inq=false}else cur+=c}
    else if(c==='"')inq=true;
    else if(c===d){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else cur+=c;
  }
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);
  return rows;
}
const HDR={name:["name","product","product name","item","item name"],price:["price","selling price","sell","sale price","sell price","mrp"],stock:["stock","qty","quantity","on hand","balance","units"],cost:["cost","buying price","buy","purchase price","avg cost","average cost","buy price"],low:["low","low stock","low-stock level","reorder","min","minimum"],category:["category","type","group"],supplier:["supplier","source","vendor"],aliases:["aliases","other names","alias"]};
function toProducts(rows){
  if(!rows.length)return {list:[],note:""};
  const head=rows[0].map(x=>String(x).trim().toLowerCase());
  const map={};
  Object.keys(HDR).forEach(k=>{const i=head.findIndex(h=>HDR[k].includes(h));if(i>-1)map[k]=i});
  let body=rows,note="";
  if(map.name!==undefined&&map.price!==undefined){body=rows.slice(1);note="Headings found."}
  else{map.name=0;map.price=1;map.stock=2;map.cost=3;note="No headings found, so the order Name, Price, Stock, Cost was used.";if(isNaN(num(rows[0][1]))||/[a-z]/i.test(String(rows[0][1])))body=rows.slice(1)}
  const list=body.map(r=>({name:String(r[map.name]==null?"":r[map.name]).trim(),price:num(r[map.price]),stock:map.stock!==undefined?num(r[map.stock]):0,cost:map.cost!==undefined?num(r[map.cost]):0,low:map.low!==undefined?num(r[map.low]):3,category:map.category!==undefined?String(r[map.category]||"").trim():"",supplier:map.supplier!==undefined?String(r[map.supplier]||"").trim():"",aliases:map.aliases!==undefined?String(r[map.aliases]||""):""}));
  return {list:list_filter(list),note};
}
function list_filter(l){return l.filter(r=>r.name||r.price)}
ui.parseText=t=>{IMP.text=t;const p=toProducts(csvRows(t));IMP.rows=p.list;IMP.note=p.note;drawImport()};
const cellVal=v=>v==null?"":(typeof v==="object"?(v.result!==undefined?v.result:(v.text!==undefined?v.text:(v.richText?v.richText.map(x=>x.text).join(""):""))):v);
ui.readFile=async f=>{
  if(!f)return;
  try{
    let rows;
    if(/\.xlsx$/i.test(f.name)){
      if(typeof ExcelJS==="undefined")return toast("The Excel library did not load. Check your internet.");
      const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());
      rows=[];wb.worksheets[0].eachRow(r=>rows.push(r.values.slice(1).map(cellVal)));
    }else rows=csvRows(await f.text());
    const p=toProducts(rows);IMP.rows=p.list;IMP.note=p.note+" File: "+f.name+".";drawImport();
  }catch(e){toast("Could not read that file.")}
};
function drawImport(){
  const el=$("#ipreview");if(!el)return;
  const ok=IMP.rows.filter(r=>r.name&&r.price>0),bad=IMP.rows.length-ok.length;
  el.innerHTML=IMP.rows.length?`<div class="card big"><h3>${ok.length} product${ok.length===1?"":"s"} ready</h3>
    <p class="note" style="margin:0 0 8px">${esc(IMP.note)}${bad?` ${bad} row${bad===1?"":"s"} will be skipped (no name or no price).`:""}</p>
    <table class="t"><tr><th>Name</th><th>Price</th><th>Stock</th><th>Cost</th></tr>${ok.slice(0,8).map(r=>`<tr><td>${esc(r.name)}</td><td>${tk(r.price)}</td><td>${r.stock}</td><td>${r.cost?tk(r.cost):"-"}</td></tr>`).join("")}</table>
    ${ok.length>8?`<p class="note">…and ${ok.length-8} more.</p>`:""}
    <button class="btn p f" style="margin-top:14px" onclick="ui.doImport()" ${ok.length?"":"disabled"}>Review ${ok.length} product${ok.length===1?"":"s"} &rarr;</button></div>`:"";
}
ui.doImport=async()=>{
  const ok=IMP.rows.filter(r=>r.name&&r.price>0);
  const j=await api({action:"importplan",rows:ok.map(r=>({name:r.name,price:r.price}))});
  if(!j.ok)return toast(errText(j.error));
  IPLAN={rows:ok,plan:j.rows,skip:j.rows.map(()=>false),letters:j.rows.map(r=>r.letters||""),req:"im"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
  view="iconfirm";render();window.scrollTo(0,0);
};
function irow(r,i){
  const row=IPLAN.rows[i];
  const st=r.status==="exists"?`<span class="tag out">skipped · ${esc(r.code)}</span>`:r.letters?`<span class="cd">${esc(r.code)}</span>`:`<input maxlength="4" style="width:84px;padding:6px 8px;text-transform:uppercase" placeholder="ABCD" value="${esc(IPLAN.letters[i])}" oninput="IPLAN.letters[${i}]=this.value.toUpperCase().replace(/[^A-Z]/g,'')">`;
  let h=`<tr${r.status==="exists"?' style="opacity:.55"':""}><td>${st}</td><td>${esc(r.name)}</td><td>${tk(row.price)}</td><td>${row.stock}</td></tr>`;
  if(r.status==="similar"&&r.candidate)h+=`<tr><td colspan="4" style="background:#f6ece0;color:#6b4a1b">Looks like <b>${esc(r.candidate.id)} ${esc(r.candidate.name)}</b> (${tk(r.candidate.price)})
    <label style="display:inline;margin:0 0 0 8px"><input type="checkbox" style="width:auto;padding:0" onchange="IPLAN.skip[${i}]=this.checked"> Skip, same product</label></td></tr>`;
  return h;
}
function renderIConfirm(){
  const c={new:0,exists:0,similar:0};IPLAN.plan.forEach(r=>{if(c[r.status]!==undefined)c[r.status]++});
  $("#app").innerHTML=`<div class="top"><small>Check before saving</small><h2>Confirm import</h2></div>
  <div class="card big"><p class="note" style="margin:0">${c.new+c.similar} will be created. ${c.exists} already exist and are skipped. ${c.similar?`<b>${c.similar} look like an existing product.</b> Tick Skip on those that are the same.`:""} Codes shown may shift by a serial number if you skip rows.</p></div>
  <p id="err" class="err"></p>
  <div class="card big"><table class="t"><tr><th>Code</th><th>Name</th><th>Price</th><th>Stock</th></tr>${IPLAN.plan.map(irow).join("")}</table></div>
  <div class="acts" style="margin-bottom:14px"><button class="btn p f" style="flex:1" onclick="ui.confirmImport()">&#10003; Confirm import</button></div>
  <button class="btn f" style="margin-bottom:14px" onclick="ui.iBack()">&larr; Back</button>`;
}
ui.iBack=()=>{view="import";render()};
ui.confirmImport=async()=>{
  const e=$("#err");e.textContent="";
  const bad=m=>{e.textContent=m;window.scrollTo(0,0)};
  const rows=[];
  for(let i=0;i<IPLAN.plan.length;i++){
    const r=IPLAN.plan[i];
    if(r.status==="exists"||r.status==="bad"||IPLAN.skip[i])continue;
    const L=IPLAN.letters[i]||r.letters||"";
    if(L.length!==4)return bad("Type 4 English letters for “"+r.name+"”.");
    rows.push(Object.assign({},IPLAN.rows[i],{letters:L}));
  }
  if(!rows.length){toast("Nothing to import.");return}
  const btn=document.querySelector(".acts .btn.p");if(btn){btn.disabled=true;btn.textContent="Importing…"}
  let created=0,skipped=0;
  for(let i=0,k=0;i<rows.length;i+=15,k++){
    const j=await api({action:"import",reqId:IPLAN.req+"-"+k,rows:rows.slice(i,i+15)});
    if(!j.ok){if(btn){btn.disabled=false;btn.textContent="✓ Confirm import"}return bad("Stopped after "+created+" products. "+errText(j.error)+" Tap Confirm again to continue. Products already saved are not repeated.")}
    created+=j.created;skipped+=j.skipped;
  }
  IPLAN=null;HIST={};toast(created+" imported"+(skipped?", "+skipped+" skipped":"")+".");
  view="main";tab="stock";load(true);
};
ui.start=()=>load();
ui.start();

(function initPTR(onRefresh){
  if(typeof document==="undefined")return;
  let el=typeof document.getElementById==="function"?document.getElementById("ptr"):null;
  const tx=()=>el&&el.querySelector?el.querySelector(".ptr-tx"):null;
  const ic=()=>el&&el.querySelector?el.querySelector(".ptr-ic"):null;
  let sx=0,sy=0,lock="",pull=0,busy=false;
  const THRESH=52;
  function setVisual(h,cls,text,glyph){
    if(!el)return;
    el.className="ptr"+(cls?" "+cls:"");
    if(el.style)el.style.height=h+"px";
    const t=tx();if(t&&text)t.textContent=text;
    const g=ic();if(g&&glyph)g.innerHTML=glyph;
  }
  async function triggerPullRefresh(){
    if(busy)return;
    busy=true;
    setVisual(44,"active busy","Refreshing…","&#8635;");
    const t0=Date.now();
    try{await onRefresh()}catch(e){}
    finally{
      const wait=Math.max(0,260-(Date.now()-t0));
      const tm=setTimeout(()=>{busy=false;setVisual(0,"","Pull down to refresh","&#8595;")},wait);
      if(tm&&typeof tm.unref==="function")tm.unref();
    }
  }
  window.triggerPullRefresh=triggerPullRefresh;
  const scrollTop=()=>Math.max(window.scrollY||0,(document.documentElement&&document.documentElement.scrollTop)||0,(document.body&&document.body.scrollTop)||0);
  document.addEventListener("touchstart",e=>{
    if(busy||!e.touches||e.touches.length!==1)return;
    if(scrollTop()>2){lock="up";return}
    const tgt=e.target;
    if(tgt&&tgt.closest&&(tgt.closest(".sheet")||tgt.closest(".modal:not([hidden])")||tgt.closest("input, textarea, select, .bar"))){lock="modal";return}
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;lock="";pull=0;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(busy||lock==="up"||lock==="h"||lock==="modal"||!e.touches||e.touches.length!==1)return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!lock){
      if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){lock="h";return}
      if(dy<-6){lock="up";return}
      if(dy>8&&Math.abs(dy)>Math.abs(dx)){if(scrollTop()>2){lock="up";return}lock="v"}else return;
    }
    if(lock==="v"){
      if(dy<=0){pull=0;setVisual(0,"pulling","","");return}
      pull=Math.min(76,Math.round(dy*0.55));
      if(e.cancelable)e.preventDefault();
      setVisual(pull,"pulling active"+(pull>=THRESH?" ready":""),pull>=THRESH?"Release to refresh":"Pull down to refresh","&#8595;");
    }
  },{passive:false});
  function onEnd(){
    if(busy)return;
    const goRef=(lock==="v"&&pull>=THRESH);
    lock="";pull=0;
    if(goRef)triggerPullRefresh();
    else setVisual(0,"","Pull down to refresh","&#8595;");
  }
  document.addEventListener("touchend",onEnd,{passive:true});
  document.addEventListener("touchcancel",onEnd,{passive:true});
})(async ()=>{HIST={};await load(true);if(!loadErr)toast("Stock refreshed");});
