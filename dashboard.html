<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b4f48">
<title>Pozzo Manager – Dashboard</title>
<meta name="description" content="Pozzo Toys Dashboard: stock value at cost and sale, low and out of stock alerts, period sales, purchases, gross profit, expenses, and net profit.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f7fa;--card:#ffffff;--sub:#f5fafe;--in:#ffffff;--line:#dce4ec;--ink:#1c1b1f;--mut:#5f6368;--grn:#1f6fa8;--bd:#deeffb;--bad:#a8431f;--badbg:#f6e4dc;--amb:#8a5a14;--ambbg:#f6ece0;--blue:#1f6fa8;--deep:#0f3f66}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom, 0px));-webkit-font-smoothing:antialiased;-webkit-overflow-scrolling:touch}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0;text-wrap:balance}
.ptr{overflow:hidden;height:0;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bd);color:var(--deep);font-size:13px;font-weight:700;border-bottom:0 solid var(--line);transition:height .18s ease,opacity .18s ease;opacity:0;user-select:none}
.ptr.pulling{transition:none}
.ptr.active{opacity:1;border-bottom-width:1px}
.ptr.ready{background:#cde5f7}
.ptr-ic{display:inline-block;transition:transform .15s ease;font-size:15px;line-height:1}
.ptr.ready .ptr-ic{transform:rotate(180deg)}
@keyframes ptrSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.ptr.busy .ptr-ic{animation:ptrSpin .75s linear infinite}
header{padding:12px 16px 14px;background:#fff;border-bottom:3px solid var(--blue);text-align:center}
header img{display:block;margin:0 auto 4px;width:96px;max-width:34%;height:auto}
header h1{font-size:22px;color:var(--deep)}
.embed header{display:none}
main{width:100%;max-width:1080px;margin:0 auto;padding:16px 14px;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}

/* Header & Period Selector */
.headbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;max-width:100%}
.headbar>*,main>section,.cols>*{min-width:0;max-width:100%}
.kicker{color:var(--mut);font-size:13.5px;margin-bottom:3px;line-height:1.35}
.headbar h2{font-size:26px;line-height:1.15}
.head-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:100%;min-width:0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px;max-width:100%}
.seg select{width:100%;border:0;background:transparent;padding:8px 12px;font:inherit;font-size:14px;font-weight:600;color:var(--grn);cursor:pointer}
.custom-range{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px;max-width:100%}
.custom-range>div{min-width:0;max-width:100%}
.custom-range label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.custom-range input[type="date"]{width:100%;min-width:0;max-width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--in);font:inherit;font-size:14px;color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--in);font:inherit;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;cursor:pointer;transition:background-color .15s ease}
.btn.p{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;border-radius:10px;font-size:13px}
.btn.w{background:var(--badbg);border-color:#e8bfae;color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible{outline:2px solid var(--grn);outline-offset:2px}

/* KPI Grids */
.sec-label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:4px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.kpi.profit{background:var(--bd);border-color:#c6ddd4}
.kpi.loss{background:var(--badbg);border-color:#e8bfae}
.kpi .lbl{color:var(--mut);font-size:14px;margin-bottom:6px}
.kpi.profit .lbl{color:var(--grn)}
.kpi.loss .lbl{color:var(--bad)}
.kpi .val{font-family:Georgia,"Times New Roman",serif;font-size:28px;font-weight:700;line-height:1.12}
.kpi.profit .val{color:var(--grn)}
.kpi.loss .val{color:var(--bad)}
.kpi .sub{color:var(--mut);font-size:13px;margin-top:6px;line-height:1.35}

/* Current Stock Valuation & Low/Out Alert Buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card h3{font-size:21px}
.stock-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sstat{background:var(--in);border:1px solid var(--line);border-radius:16px;padding:14px}
.sstat .lbl{font-size:13px;color:var(--mut);margin-bottom:4px}
.sstat .val{font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:700;line-height:1.15}
.sstat .sub{font-size:13px;color:var(--mut);margin-top:4px}

.alert-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.abtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:74px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--in);font:inherit;color:var(--ink);text-align:left;cursor:pointer;transition:background-color .15s ease,border-color .15s ease}
.abtn.warn{background:var(--ambbg);border-color:#e5cfa8}
.abtn.bad{background:var(--badbg);border-color:#e8bfae}
.abtn:focus-visible{outline:2px solid var(--grn);outline-offset:2px}
.abtn .atitle{font-weight:700;font-size:16px}
.abtn.warn .atitle{color:var(--amb)}
.abtn.bad .atitle{color:var(--bad)}
.abtn .asub{font-size:13px;color:var(--mut);margin-top:3px}
.abtn .aright{text-align:right;flex:none}
.abtn .aval{font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:700}
.abtn.warn .aval{color:var(--amb)}
.abtn.bad .aval{color:var(--bad)}
.abtn .act{font-size:12px;font-weight:600;color:var(--mut);margin-top:3px}

/* Main Columns */
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.pl-table{border-top:1px solid var(--line);margin-bottom:16px}
.pl-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.pl-row.mut{color:var(--mut)}
.pl-row.sub{font-weight:700}
.pl-row.net{border-bottom:0;padding-top:14px;font-size:18px;font-weight:700}
.pl-row.net .amt{font-family:Georgia,"Times New Roman",serif;font-size:24px}
.pl-row.net.pos .amt{color:var(--grn)}
.pl-row.net.neg .amt{color:var(--bad)}

.cat-list{margin-top:10px;border-top:1px solid var(--line)}
.cat-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cat-row:last-child{border-bottom:0}
.exp-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.exp-item:last-child{border-bottom:0}
.exp-item .ename{font-weight:600;font-size:15px}
.exp-item .emeta{font-size:13px;color:var(--mut);margin-top:2px}
.exp-item .eright{display:flex;align-items:center;gap:10px;flex:none}
.exp-item .eamt{font-weight:700;font-size:15px;color:var(--bad)}

/* Orders & Workspace */
.list{border-top:1px solid var(--line)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item .main{min-width:0;flex:1}
.item .title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{color:var(--mut);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .side{text-align:right;flex:none}
.item .amt{font-weight:700;font-size:15px}
.st-ok{color:var(--grn);font-weight:600}
.st-warn{color:var(--amb);font-weight:600}
.st-bad{color:var(--bad);font-weight:600}

.navgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.navtile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:72px;padding:13px 15px;border-radius:16px;border:1px solid var(--line);background:var(--in);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.navtile b{font-size:15px}
.navtile span{color:var(--mut);font-size:13px;margin-top:4px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(30,25,15,.46);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:12px}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px;padding:22px 20px 24px;max-height:90vh;overflow:auto;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sheet h3{font-size:23px}
.sheet .sub{color:var(--mut);margin:0 0 14px;font-size:14px;line-height:1.45}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;min-height:46px;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--in);font:inherit;font-size:16px;color:var(--ink)}
.cat-picks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cat-picks button{min-height:38px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--in);font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.cat-picks button.on{background:var(--grn);border-color:var(--grn);color:#fff}
.new-cat-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.new-cat-row input{flex:1}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.acts .btn{flex:1}
.err{color:var(--bad);font-size:14px;margin:0 0 10px;font-weight:600}
.flash{background:var(--bd);color:var(--grn);border:1px solid #c6ddd4;border-radius:16px;padding:11px 15px;margin-bottom:14px;font-size:14px;font-weight:600}
.notice{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.notice h3{font-size:20px;margin-bottom:6px}
.notice p{margin:0 0 12px;color:var(--mut);font-size:15px;line-height:1.5}
.empty{padding:18px 0;color:var(--mut);font-size:14px}
.skel{height:18px;background:var(--sub);border-radius:8px;margin:10px 0}
[hidden]{display:none!important}

@media (max-width:880px){
  .headbar{flex-direction:column;align-items:stretch;gap:10px;margin-bottom:12px}
  .head-right{flex-direction:column;align-items:stretch;width:100%}
  .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:4px}
  .seg button{width:100%;min-width:0;padding:8px 4px;font-size:12.5px;text-align:center;overflow:hidden;text-overflow:ellipsis}
  .kpis,.stock-stats,.alert-btns,.navgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .alert-btns .abtn:nth-child(3){grid-column:span 2}
  .stock-stats .sstat-wide{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cols{grid-template-columns:1fr}
}
@media (max-width:600px){
  main{padding:12px}
  .custom-range{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px}
  .custom-range .btn{grid-column:1 / -1;width:100%}
  .kpis,.stock-stats,.alert-btns,.navgrid{gap:8px}
  .kpis{margin-bottom:12px}
  .kpi{padding:12px;border-radius:16px}
  .kpi .lbl{font-size:12.5px;margin-bottom:4px}
  .kpi .val{font-size:20px}
  .kpi .sub{font-size:11.5px;margin-top:4px}
  .card{padding:14px 12px;border-radius:18px;margin-bottom:12px}
  .card h3{font-size:19px}
  .sstat{padding:11px 12px;border-radius:14px}
  .sstat .lbl{font-size:12px}
  .sstat .val{font-size:19px}
  .sstat .sub{font-size:11.5px}
  .abtn{flex-direction:column;align-items:flex-start;gap:6px;padding:12px;min-height:auto;border-radius:15px}
  .abtn .atitle{font-size:14px}
  .abtn .asub{font-size:11.5px}
  .abtn .aright{text-align:left;width:100%}
  .abtn .aval{font-size:16px}
  .abtn .act{font-size:11.5px}
  .navtile{padding:11px 12px;min-height:62px}
  .navtile span{font-size:12px}
}
</style>
</head>
<body>
<script>if(window.self!==window.top)document.documentElement.classList.add("embed")</script>
<div id="ptr" class="ptr" aria-live="polite"><span class="ptr-ic" aria-hidden="true">&#8595;</span><span class="ptr-tx">Pull down to refresh</span></div>
<header><img src="icon-192.png" alt="Pozzo Toys"><h1>Pozzo Manager</h1></header>
<main id="app"></main>
<div id="modal" class="modal" hidden onclick="if(event.target===this)closeModal()"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const num=v=>{const n=parseFloat(String(v).replace(/[,৳\s]|tk/gi,""));return isNaN(n)?0:n};
const tk=n=>{
  const v=Math.round(Number(n)||0);
  return (v<0?"−৳ ":"৳ ")+Math.abs(v).toLocaleString("en-US");
};
const pad=n=>String(n).padStart(2,"0");
const fmtDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function today(){return fmtDate(new Date())}
function monthBounds(y,m){
  const start=new Date(y,m-1,1);
  const end=new Date(y,m,0);
  return {from:fmtDate(start),to:fmtDate(end)};
}
function niceDate(s){
  const p=String(s||"").split("-");
  if(p.length!==3)return String(s||"");
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return Number(p[2])+" "+(M[Number(p[1])-1]||p[1])+" "+p[0];
}
const cfg=()=>{try{return JSON.parse(localStorage.getItem("pt_cfg")||"{}")}catch(e){return{}}};
const localCats=()=>{try{const a=JSON.parse(localStorage.getItem("pt_exp_cats")||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}};
const saveLocalCats=arr=>{try{localStorage.setItem("pt_exp_cats",JSON.stringify(arr))}catch(e){}};

async function api(payload){
  const c=cfg();if(!c.url||!c.key)return {ok:false,error:"nocfg"};
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),45000);
  try{
    const r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:c.key},payload)),signal:ac.signal});
    return await r.json();
  }catch(e){return {ok:false,error:e&&e.name==="AbortError"?"slow":"no connection"}}
  finally{clearTimeout(t)}
}

function goTab(tab,extra){
  try{
    if(window.parent&&window.parent!==window){
      window.parent.postMessage(Object.assign({type:"pozzo:switch-tab",tab:tab},extra||{}),"*");
      return;
    }
  }catch(e){}
  const map={dashboard:"dashboard.html",dispatch:"dispatch.html",sale:"orders.html",sales:"orders.html",stock:"stock.html",sticker:"stickers.html",stickers:"stickers.html"};
  if(map[tab])window.location.href=map[tab];
}

const DEFAULT_CATS=["Meta Ads Cost","Packaging","Transportation","Courier & COD Fee","Rent & Utilities","Salary","Other"];
const tdNow=today();
const curMonthInit=monthBounds(Number(tdNow.slice(0,4)),Number(tdNow.slice(5,7)));

let state={
  rangeMode:"month", // default: This month
  customFrom:curMonthInit.from,
  customTo:tdNow,
  loading:true,
  error:"",
  flash:"",
  data:null,
  confirmDelExpId:"",
  modal:null // null | {type:'low'|'out'|'purchases'|'expense', ...}
};

function activeDates(){
  const td=today();
  const y=Number(td.slice(0,4)),m=Number(td.slice(5,7)),day=Number(td.slice(8,10));
  if(state.rangeMode==="month"){
    return Object.assign(monthBounds(y,m),{label:"This month"});
  }
  if(state.rangeMode==="last_month"){
    const pm=m===1?12:m-1,py=m===1?y-1:y;
    return Object.assign(monthBounds(py,pm),{label:"Last month"});
  }
  if(state.rangeMode==="today"){
    return {from:td,to:td,label:"Today"};
  }
  if(state.rangeMode==="week"){
    const start=new Date(y,m-1,day-6);
    return {from:fmtDate(start),to:td,label:"Last 7 days"};
  }
  if(state.rangeMode==="all"){
    return {from:"2020-01-01",to:td,range:"all",label:"All time"};
  }
  const f=state.customFrom||curMonthInit.from;
  const t=state.customTo||td;
  return f<=t?{from:f,to:t,label:"Custom range"}:{from:t,to:f,label:"Custom range"};
}

function allCategories(){
  const serverCats=(state.data&&Array.isArray(state.data.categories))?state.data.categories:[];
  const merged=DEFAULT_CATS.concat(serverCats,localCats());
  const seen={},out=[];
  merged.forEach(c=>{
    const s=String(c||"").trim();
    if(!s)return;
    const k=s.toLowerCase();
    if(!seen[k]){seen[k]=true;out.push(s)}
  });
  return out;
}

const DASH_CACHE_PREFIX="pt_dash_";
function getCachedDash(key){
  try{
    const raw=sessionStorage.getItem(DASH_CACHE_PREFIX+key);
    if(!raw)return null;
    const p=JSON.parse(raw);
    return(p&&p.data&&typeof p.ts==="number")?p:null;
  }catch(e){return null}
}
function setCachedDash(key,data){
  try{sessionStorage.setItem(DASH_CACHE_PREFIX+key,JSON.stringify({ts:Date.now(),data:data}))}catch(e){}
}
function clearDashCache(){
  try{
    Object.keys(sessionStorage).forEach(k=>{
      if(k.startsWith(DASH_CACHE_PREFIX))sessionStorage.removeItem(k);
    });
  }catch(e){}
}

let _dashFetchPromise=null;
async function loadDashboard(fresh){
  const r=activeDates();
  const cacheKey=r.from+"_"+r.to+"_"+(r.range||"");
  const cached=getCachedDash(cacheKey);

  // Instant render from client cache if available
  if(cached&&cached.data){
    state.data=cached.data;
    state.loading=false;
    state.error="";
    render();
    if(!fresh&&(Date.now()-cached.ts<90000))return;
  }else if(!state.data){
    state.loading=true;state.error="";
    render();
  }

  const c=cfg();
  if(!c.url||!c.key){state.loading=false;state.error="nocfg";render();return}

  // Deduplicate overlapping requests
  if(_dashFetchPromise)return _dashFetchPromise;
  _dashFetchPromise=(async()=>{
    try{
      const j=await api({action:"dashboard",from:r.from,to:r.to,range:r.range||"",today:today(),fresh:!!fresh});
      state.loading=false;
      if(!j.ok){
        if(!state.data){state.error=j.error||"Could not load dashboard data";render()}
        return;
      }
      state.data=j;
      setCachedDash(cacheKey,j);
      if(Array.isArray(j.categories)){
        const customOnly=j.categories.filter(x=>!DEFAULT_CATS.some(d=>d.toLowerCase()===x.toLowerCase()));
        if(customOnly.length)saveLocalCats(customOnly);
      }
      render();
    }finally{
      _dashFetchPromise=null;
    }
  })();
  return _dashFetchPromise;
}

function setRange(mode){
  state.rangeMode=mode;
  state.flash="";
  if(mode!=="custom")loadDashboard(false);
  else render();
}

function applyCustomRange(){
  const f=$("#cfrom")?$("#cfrom").value:state.customFrom;
  const t=$("#cto")?$("#cto").value:state.customTo;
  if(!f||!t)return;
  state.customFrom=f<=t?f:t;
  state.customTo=f<=t?t:f;
  loadDashboard(false);
}

function statusClass(st){
  if(st==="Cancelled"||st==="Returned")return "st-bad";
  if(st==="Partial Return")return "st-warn";
  return "st-ok";
}

function render(){
  const app=$("#app");
  if(state.error==="nocfg"){
    app.innerHTML=`<div class="headbar"><div><div class="kicker">Pozzo Toys</div><h2>Dashboard</h2></div></div>
    <div class="notice"><h3>Connect your Google Sheet</h3>

/* ---------- Modals: Add Expense & Custom Categories, Low/Out Stock Lists, Purchases ---------- */
function closeModal(){
  state.modal=null;
  const m=$("#modal");
  if(m){m.hidden=true;m.innerHTML=""}
}

function openExpenseModal(){
  const cats=allCategories();
  state.modal={
    type:"expense",
    date:today(),
    category:cats[0]||"Meta Ads Cost",
    amount:"",
    note:"",
    showNewCat:false,
    newCatName:"",
    err:"",
    saving:false
  };
  renderExpenseModal();
}

function renderExpenseModal(){
  const st=state.modal;
  if(!st||st.type!=="expense")return;
  const cats=allCategories();
  const m=$("#modal");
  m.hidden=false;
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="expTitle">
    <div class="sheet-head">
      <h3 id="expTitle">Add other expense</h3>
      <button class="btn sm" type="button" onclick="closeModal()">Close</button>
    </div>
    <p class="sub">Log Meta ads cost, packaging, transportation, or add your own custom category.</p>
    ${st.err?`<p class="err">${esc(st.err)}</p>`:""}

    <div class="field">
      <label>Category</label>
      <div class="cat-picks">
        ${cats.map(c=>`<button type="button" class="${st.category===c?"on":""}" onclick="pickExpenseCat('${esc(c)}')">${esc(c)}</button>`).join("")}
        <button type="button" onclick="toggleNewCategory()">${st.showNewCat?"Cancel new":"+ My category"}</button>
      </div>
      ${st.showNewCat?`<div class="new-cat-row">
        <input id="newCatInp" placeholder="e.g. Facebook Boost, Gift Box" value="${esc(st.newCatName)}" oninput="state.modal.newCatName=this.value">
        <button class="btn p sm" type="button" onclick="saveCustomCategory()">Add</button>
      </div>`:""}
    </div>

    <div class="field">
      <label for="expAmt">Amount (৳)</label>
      <input id="expAmt" inputmode="decimal" type="number" min="1" step="any" placeholder="e.g. 500" value="${esc(st.amount)}" oninput="state.modal.amount=this.value">
    </div>

    <div class="field">
      <label for="expDate">Date</label>
      <input id="expDate" type="date" value="${esc(st.date)}" oninput="state.modal.date=this.value">
    </div>

    <div class="field">
      <label for="expNote">Note (optional)</label>
      <input id="expNote" placeholder="e.g. 3-day toy ad campaign, 200 cartons" value="${esc(st.note)}" oninput="state.modal.note=this.value">
    </div>

    <div class="acts">
      <button class="btn" type="button" onclick="closeModal()">Cancel</button>
      <button class="btn p" id="saveExpBtn" type="button" onclick="submitExpense()" ${st.saving?"disabled":""}>${st.saving?"Saving…":"Save expense"}</button>
    </div>
  </div>`;
}

function pickExpenseCat(cat){
  if(!state.modal||state.modal.type!=="expense")return;
  state.modal.category=cat;
  renderExpenseModal();
}

function toggleNewCategory(){
  if(!state.modal||state.modal.type!=="expense")return;
  state.modal.showNewCat=!state.modal.showNewCat;
  state.modal.err="";
  renderExpenseModal();
}

async function saveCustomCategory(){
  if(!state.modal||state.modal.type!=="expense")return;
  const inp=$("#newCatInp");
  const raw=((inp&&inp.value)||state.modal.newCatName||"").trim();
  if(!raw){
    state.modal.err="Type a category name first.";
    renderExpenseModal();
    return;
  }
  const lc=localCats();
  if(!lc.some(x=>x.toLowerCase()===raw.toLowerCase())){
    lc.push(raw);
    saveLocalCats(lc);
  }
  state.modal.category=raw;
  state.modal.showNewCat=false;
  state.modal.newCatName="";
  state.modal.err="";
  renderExpenseModal();
  // Persist to Google Apps Script in background
  const j=await api({action:"addexpensecategory",name:raw});
  if(j&&j.ok&&state.data&&Array.isArray(j.categories)){
    state.data.categories=j.categories;
  }
}

async function submitExpense(){
  if(!state.modal||state.modal.type!=="expense"||state.modal.saving)return;
  const amtEl=$("#expAmt"),dtEl=$("#expDate"),ntEl=$("#expNote");
  const amt=num((amtEl&&amtEl.value)||state.modal.amount);
  const dt=(dtEl&&dtEl.value)||state.modal.date||today();
  const nt=(ntEl&&ntEl.value)||state.modal.note||"";
  const cat=state.modal.category||"Other";
  if(!(amt>0)){
    state.modal.err="Enter an expense amount above 0.";
    renderExpenseModal();
    return;
  }
  state.modal.amount=amt;
  state.modal.date=dt;
  state.modal.note=nt;
  state.modal.saving=true;
  state.modal.err="";
  renderExpenseModal();

  const j=await api({action:"addexpense",date:dt,category:cat,amount:amt,note:nt,today:today()});
  if(!j.ok){
    state.modal.saving=false;
    state.modal.err=j.error||"Could not save expense.";
    renderExpenseModal();
    return;
  }
  closeModal();
  clearDashCache();
  state.flash="Saved expense: "+cat+" ("+tk(amt)+")";
  await loadDashboard(true);
}

function askDeleteExpense(id){
  state.confirmDelExpId=(state.confirmDelExpId===id)?"":id;
  render();
}

async function confirmDeleteExpense(id){
  state.confirmDelExpId="";
  const j=await api({action:"deleteexpense",id:id,today:today()});
  if(!j.ok){
    state.error=j.error||"Could not delete expense.";
    render();
    return;
  }
  clearDashCache();
  state.flash="Expense entry removed.";
  await loadDashboard(true);
}

    :`<div class="empty">No stock purchases recorded in ${esc(r.label.toLowerCase())}.</div>`}

window.addEventListener("message",e=>{
  if(e&&e.data&&(e.data.type==="pozzo:refresh-dashboard"||e.data.type==="pozzo:order-dirty")){
    clearDashCache();
    loadDashboard(true);
  }
});

(function initPTR(onRefresh){
  if(typeof document==="undefined")return;
  let el=typeof document.getElementById==="function"?document.getElementById("ptr"):null;
  const tx=()=>el&&el.querySelector?el.querySelector(".ptr-tx"):null;
  const ic=()=>el&&el.querySelector?el.querySelector(".ptr-ic"):null;
  let sx=0,sy=0,lock="",pull=0,busy=false;
  const THRESH=52;
  function setVisual(h,cls,text,glyph){
    if(!el)return;
    el.className="ptr"+(cls?" "+cls:"");
    if(el.style)el.style.height=h+"px";
    const t=tx();if(t&&text)t.textContent=text;
    const g=ic();if(g&&glyph)g.innerHTML=glyph;
  }
  async function triggerPullRefresh(){
    if(busy)return;
    busy=true;
    setVisual(44,"active busy","Refreshing…","&#8635;");
    const t0=Date.now();
    try{await onRefresh()}catch(e){}
    finally{
      const wait=Math.max(0,260-(Date.now()-t0));
      const tm=setTimeout(()=>{busy=false;setVisual(0,"","Pull down to refresh","&#8595;")},wait);
      if(tm&&typeof tm.unref==="function")tm.unref();
    }
  }
  window.triggerPullRefresh=triggerPullRefresh;
  const scrollTop=()=>Math.max(window.scrollY||0,(document.documentElement&&document.documentElement.scrollTop)||0,(document.body&&document.body.scrollTop)||0);
  document.addEventListener("touchstart",e=>{
    if(busy||!e.touches||e.touches.length!==1)return;
    if(scrollTop()>2){lock="up";return}
    const tgt=e.target;
    if(tgt&&tgt.closest&&(tgt.closest(".sheet")||tgt.closest(".modal:not([hidden])")||tgt.closest("input, textarea, select"))){lock="modal";return}
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;lock="";pull=0;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(busy||lock==="up"||lock==="h"||lock==="modal"||!e.touches||e.touches.length!==1)return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!lock){
      if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){lock="h";return}
      if(dy<-6){lock="up";return}
      if(dy>8&&Math.abs(dy)>Math.abs(dx)){if(scrollTop()>2){lock="up";return}lock="v"}else return;
    }
    if(lock==="v"){
      if(dy<=0){pull=0;setVisual(0,"pulling","","");return}
      pull=Math.min(76,Math.round(dy*0.55));
      if(e.cancelable)e.preventDefault();
      setVisual(pull,"pulling active"+(pull>=THRESH?" ready":""),pull>=THRESH?"Release to refresh":"Pull down to refresh","&#8595;");
    }
  },{passive:false});
  function onEnd(){
    if(busy)return;
    const goRef=(lock==="v"&&pull>=THRESH);
    lock="";pull=0;
    if(goRef)triggerPullRefresh();
    else setVisual(0,"","Pull down to refresh","&#8595;");
  }
  document.addEventListener("touchend",onEnd,{passive:true});
  document.addEventListener("touchcancel",onEnd,{passive:true});
})(()=>loadDashboard(true));

loadDashboard(false);
</script>
